<!DOCTYPE html>
<html lang="en">
<head>
  <title>U-LIFE</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins">
  <style>
    body, h1, h2, h3, h4, h5 { font-family: "Poppins", sans-serif; }
    body { font-size: 16px; }
    #content-frame {
      width: 100%;
      height: 600px;
      border: none;
    }
  </style>
</head>
<body>

<!-- Sidebar/menu -->
<nav class="w3-sidebar w3-purple w3-collapse w3-top w3-large w3-padding" style="z-index:3;width:300px;font-weight:bold;" id="mySidebar"><br>
  <a href="javascript:void(0)" onclick="w3_close()" class="w3-button w3-hide-large w3-display-topleft" style="width:100%;font-size:22px">Cerrar Menú</a>
  <div class="w3-container">
    <h3 class="w3-padding-64"><b>U-LIFE</b></h3>
  </div>
  <div class="w3-bar-block">
    <!-- Enlaces que cargan contenido en el iframe -->
    <a href="/app/home" target="content-frame" class="w3-bar-item w3-button w3-hover-white">Inicio</a>
    <a href="/app/login" class="w3-bar-item w3-button w3-hover-white">Iniciar Sesión</a>
  </div>
</nav>

<!-- Contenedor del iframe -->
<div style="margin-left: 340px; margin-top: 50px; padding: 20px;">
  <!-- Aquí se cargará el contenido -->
  <iframe id="content-frame" name="content-frame"></iframe>
</div>

<script>
  // Script para abrir/cerrar el menú
  function w3_open() {
    document.getElementById("mySidebar").style.display = "block";
  }

  function w3_close() {
    document.getElementById("mySidebar").style.display = "none";
  }
</script>

</body>
</html>
