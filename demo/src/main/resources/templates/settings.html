<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="es">
<head>
    <title>Ajustes - U-LIFE</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins">
    <style>
        body, h1, h2, h3, h4, h5 { font-family: "Poppins", sans-serif; }
        body { font-size: 16px; }
        .form-container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: #f9f9f9;
        }
        .form-container label {
            font-weight: bold;
        }
        .form-container input[type="text"],
        .form-container input[type="email"],
        .form-container input[type="password"],
        .form-container input[type="number"] {
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .form-container button,
        .form-container input[type="reset"],
        .form-container input[type="submit"] {
            background-color: #6a1b9a;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .form-container button:hover,
        .form-container input[type="reset"]:hover,
        .form-container input[type="submit"]:hover {
            background-color: #9c27b0;
        }
    </style>
</head>
<body>

<!-- Title -->
<h1 class="w3-xxxlarge w3-text-purple"><b>Ajustes</b></h1>
<hr style="width:50px;border:5px solid purple" class="w3-round">
<p>Edita tu perfil para mantener tu información actualizada.</p>
<hr style="width:50px;border:5px solid purple" class="w3-round">

<!-- Edit Profile Form -->
<div class="form-container">
    <h2 class="w3-text-purple">Editar Perfil</h2>
    <form th:action="@{/app/register}" method="post" th:object="${registerForm}">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" th:field="*{nombre}" placeholder="Ingresa tu nombre" required>

        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" name="apellido" th:field="*{apellido}" placeholder="Ingresa tu apellido" required>

        <label for="telefono">Teléfono:</label>
        <input type="text" id="telefono" name="telefono" th:field="*{telefono}" placeholder="Ingresa tu teléfono" required>

        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad" th:field="*{edad}" placeholder="Ingresa tu edad" required>

        <label for="registro">Login:</label>
        <input type="text" id="registro" name="registro" th:field="*{registro}" placeholder="Ingresa tu login" required>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" th:field="*{password}" placeholder="Ingresa tu nueva contraseña" required>

        <input type="reset" value="Borrar">
        <input type="submit" value="Guardar Cambios">
    </form>
</div>

</body>
</html>
